name: Python contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps --no-build-isolation
      - run: python -m pytest -q
      - run: python -m build --no-isolation
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: idp_test
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: idp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U idp_test -d idp_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      IDP_TEST_DSN: postgresql://idp_test:disposable-ci-password@127.0.0.1:5432/idp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps --no-build-isolation
      - run: python -m pytest -q
