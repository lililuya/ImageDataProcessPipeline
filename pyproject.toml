[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "image-data-process-pipeline"
version = "0.1.0"
description = "Traceable image training data preparation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic==2.14.1", "Pillow==12.3.0", "psycopg[binary]==3.3.6"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "build==1.6.1"]

[project.scripts]
idp = "idp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
